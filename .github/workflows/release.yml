name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag, for example v1.0.0'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate tag and plugin versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(awk -F': ' '/^[[:space:]]*\*[[:space:]]Version:/ { print $2; exit }' icon-library.php | tr -d '\r')"
          tag_version="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ || "$tag_version" != "$plugin_version" ]]; then
            echo "Stable tag does not match the plugin version: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force --tags origin
          tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          current_commit="$(git rev-parse HEAD)"
          if [[ -z "$tagged_commit" || "$tagged_commit" != "$current_commit" ]]; then
            echo "The existing stable tag must point to the checked-out commit." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$current_commit" >> "$GITHUB_OUTPUT"

      - name: Install block parser test dependency
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-6.8.tar.gz -o /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          echo "WP_CORE_DIR=/tmp/wordpress" >> "$GITHUB_ENV"

      - name: Run project checks
        run: composer check
      - name: Test admin navigation
        run: node --test tests/*.test.js

      - name: Build production ZIP
        run: composer package

      - name: Validate production ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="build/icon-library.${RELEASE_TAG#v}.zip"
          test -s "$archive"
          size="$(stat -c '%s' "$archive")"
          if (( size >= 10485760 )); then
            echo "WordPress.org submission ZIP is too large: $size bytes" >&2
            exit 1
          fi
          unzip -t "$archive" >/dev/null
          if unzip -Z1 "$archive" | grep -Eq '^icon-library/(vendor|tests|build|\.git|\.github|scripts)(/|$)'; then
            echo 'Development or repository files were found in the production ZIP.' >&2
            exit 1
          fi
          mkdir -p build/plugin-check
          unzip -q "$archive" -d build/plugin-check

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: build/plugin-check/icon-library

      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icon-library-release
          path: build/icon-library.*.zip
          if-no-files-found: error

  publish:
    name: Publish stable release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: icon-library-release
          path: artifact

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          archive="$(find artifact -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; stable release assets are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$archive" \
            --target "$RELEASE_COMMIT" \
            --generate-notes \
            --latest \
            --title "Icon Library $RELEASE_TAG"
