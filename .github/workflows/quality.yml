name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - release/1.0.0

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - if: matrix.php == '8.4'
        run: composer package
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: icon-library-1.0.0
          path: build/icon-library.1.0.0.zip
          if-no-files-found: error

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, zip
          coverage: none
      - run: composer package
      - run: mkdir -p build/plugin-check && unzip -q build/icon-library.1.0.0.zip -d build/plugin-check
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/plugin-check/icon-library
